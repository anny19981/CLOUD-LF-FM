<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLOUD ÖÖLF</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- VISUALIZER -->
<canvas id="visualizer"></canvas>

<!-- SIDEBAR -->
<div class="sidebar">
    <a class="active" href="#" data-view="home">Home</a>
    <a href="#" data-view="songs">Songs</a>
    <a href="#" data-view="playlist">Playlist</a>
    <a href="#" data-view="artists">Artists</a>
</div>

<!-- PLAYER & CONTENT -->
<div class="player">

    <!-- MENU / SEARCH -->
    <div class="menu">
        <input id="search" placeholder="Songs oder Artists suchen">

        <!-- Artists View -->
        <div id="view-artists">
            <h3>🎤 Artists</h3>
            <div id="artists"></div>
        </div>

        <!-- Songs View -->
        <div id="view-songs">
            <h3>🎵 Songs</h3>
            <div id="songList"></div>
        </div>

        <!-- Playlist View -->
        <div id="view-playlist">
            <h3>❤️ Playlist</h3>
            <div id="playlist"></div>
        </div>
    </div>

    <!-- COVER & INFO -->
    <div class="cover" id="cover"></div>
    <div class="title" id="title"></div>
    <div class="artist" id="artist"></div>

    <!-- PROGRESS -->
    <input type="range" id="progress" class="progress" value="0">
    <div class="time">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <button id="shuffle">🔀</button>
        <button id="prev">⏮</button>
        <button class="play" id="play">▶️</button>
        <button id="next">⏭</button>
        <button id="repeat">🔁</button>
    </div>

</div>

<!-- AUDIO ELEMENT -->
<audio id="audio"></audio>

<!-- SCRIPT -->
<script src="app.js"></script>
</body>
</html>
